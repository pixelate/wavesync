name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        ruby: ["4.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libtag1-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install gems
        run: |
          bundle config build.taglib-ruby --with-tag-lib=/usr/lib/x86_64-linux-gnu
          bundle install --jobs 4

      - name: Run tests
        run: bundle exec rake test

  lint:
    name: Lint (RuboCop)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libtag1-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install gems
        run: |
          bundle config build.taglib-ruby --with-tag-lib=/usr/lib/x86_64-linux-gnu
          bundle install --jobs 4

      - name: Run RuboCop
        run: bundle exec rubocop
