name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        ruby: ["4.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg cmake
          # Ubuntu LTS only ships TagLib 1.x; taglib-ruby 2.0 requires TagLib 2.x
          curl -sSL https://taglib.org/releases/taglib-2.2.tar.gz | tar -xz
          cmake -S taglib-2.2 -B taglib-2.2/build \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=ON
          cmake --build taglib-2.2/build --parallel $(nproc)
          sudo cmake --install taglib-2.2/build
          sudo ldconfig

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install gems
        run: |
          bundle config build.taglib-ruby --with-tag-dir=/usr/local
          bundle install --jobs 4

      - name: Run tests
        run: bundle exec rake test

  lint:
    name: Lint (RuboCop)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake
          # Ubuntu LTS only ships TagLib 1.x; taglib-ruby 2.0 requires TagLib 2.x
          curl -sSL https://taglib.org/releases/taglib-2.2.tar.gz | tar -xz
          cmake -S taglib-2.2 -B taglib-2.2/build \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=ON
          cmake --build taglib-2.2/build --parallel $(nproc)
          sudo cmake --install taglib-2.2/build
          sudo ldconfig

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install gems
        run: |
          bundle config build.taglib-ruby --with-tag-dir=/usr/local
          bundle install --jobs 4

      - name: Run RuboCop
        run: bundle exec rubocop
